
name: Test RAM

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - name: Check RAM and CPU
        run: |
          echo "Checking RAM..."
          free -h
          echo "Checking CPU..."
          nproc

      - name: Cache llama.cpp
        id: llama-cache
        uses: actions/cache@v4
        with:
          path: llama.cpp
          key: llama-build-v1

      - name: Set up llama.cpp
        if: steps.llama-cache.outputs.cache-hit != 'true'
        run: |
          # Get llama.cpp
          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git

          # Install what we need
          sudo apt-get update
          sudo apt-get install -y cmake build-essential

          # Build llama.cpp
          cmake -S llama.cpp -B llama.cpp/build
          cmake --build llama.cpp/build --config Release -j 4

          # Check the build
          ls llama.cpp/build/bin

      - name: Cache AI model
        id: model-cache
        uses: actions/cache@v4
        with:
          path: models/tinyllama.gguf
          key: tinyllama-model-v1

      - name: Download AI model
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: |
          # Make a folder
          mkdir -p models

          # Download TinyLlama
          curl -fL --retry 3 -o models/tinyllama.gguf \
            https://huggingface.co/TheBloke/TinyLlama-1.1B-Chat-v1.0-GGUF/resolve/main/tinyllama-1.1b-chat-v1.0.Q4_K_M.gguf

          # Check the model
          ls -lh models/

      - name: Test normal RAM
        run: |
          # Run TinyLlama normally
          ./llama.cpp/build/bin/llama-cli \
            -m models/tinyllama.gguf \
            -p "Explain artificial intelligence in simple words." \
            -n 100 \
            -t 4 \
            --no-display-prompt

      - name: Test 4 GB RAM limit
        run: |
          # Make a folder for results
          mkdir -p results

          # Run TinyLlama 3 times with 4 GB RAM
          for i in 1 2 3
          do
            echo "4 GB RAM - Test $i"

            docker run --rm \
              --memory=4g \
              --cpus=4 \
              -v "$PWD:/work" \
              -w /work \
              ubuntu:24.04 \
              bash -c '
                apt-get update -qq &&
                apt-get install -y -qq libgomp1 &&
                export LD_LIBRARY_PATH=/work/llama.cpp/build/bin:$LD_LIBRARY_PATH &&
                ./llama.cpp/build/bin/llama-cli \
                  -m models/tinyllama.gguf \
                  -p "Explain artificial intelligence in simple words." \
                  -n 100 \
                  -t 4 \
                  --no-display-prompt
              ' 2>&1 | tee "results/4gb_test_$i.txt"

            # Stop if the test fails
            test "${PIPESTATUS[0]}" -eq 0 || exit 1
          done

      - name: Test 2 GB RAM limit
        run: |
          # Run TinyLlama 3 times with 2 GB RAM
          for i in 1 2 3
          do
            echo "2 GB RAM - Test $i"

            docker run --rm \
              --memory=2g \
              --cpus=4 \
              -v "$PWD:/work" \
              -w /work \
              ubuntu:24.04 \
              bash -c '
                apt-get update -qq &&
                apt-get install -y -qq libgomp1 &&
                export LD_LIBRARY_PATH=/work/llama.cpp/build/bin:$LD_LIBRARY_PATH &&
                ./llama.cpp/build/bin/llama-cli \
                  -m models/tinyllama.gguf \
                  -p "Explain artificial intelligence in simple words." \
                  -n 100 \
                  -t 4 \
                  --no-display-prompt
              ' 2>&1 | tee "results/2gb_test_$i.txt"

            # Stop if the test fails
            test "${PIPESTATUS[0]}" -eq 0 || exit 1
          done

      - name: Make results CSV
        if: always()
        run: |
          # Put the test speeds into one CSV file
          python3 - <<'PY'
          import csv
          import glob
          import re

          with open("results.csv", "w", newline="") as f:
              w = csv.writer(f)
              w.writerow(["RAM_GB", "Test", "Prompt_tps", "Generation_tps", "Status"])

              for ram in [4, 2]:
                  for i in range(1, 4):
                      file = f"results/{ram}gb_test_{i}.txt"

                      try:
                          with open(file, errors="replace") as x:
                              s = x.read()

                          m = re.search(
                              r"Prompt:\s*([\d.]+)\s*t/s\s*\|\s*Generation:\s*([\d.]+)\s*t/s",
                              s
                          )

                          if m and "Exiting..." in s:
                              w.writerow([ram, i, m.group(1), m.group(2), "Passed"])
                          else:
                              w.writerow([ram, i, "", "", "Failed"])

                      except FileNotFoundError:
                          w.writerow([ram, i, "", "", "Failed"])
          PY

          cat results.csv

      - name: Save test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ram-test-results
          path: |
            results/
            results.csv
          if-no-files-found: warn
