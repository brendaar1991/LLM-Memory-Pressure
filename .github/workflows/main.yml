
name: Test RAM

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - name: Check RAM and CPU
        run: |
          echo "Checking RAM..."
          free -h
          echo "Checking CPU..."
          nproc

      - name: Cache llama.cpp
        id: llama-cache
        uses: actions/cache@v4
        with:
          path: llama.cpp
          key: llama-build-v1

      - name: Set up llama.cpp
        if: steps.llama-cache.outputs.cache-hit != 'true'
        run: |
          # Get llama.cpp
          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git

          # Install what we need
          sudo apt-get update
          sudo apt-get install -y cmake build-essential

          # Build llama.cpp
          cmake -S llama.cpp -B llama.cpp/build
          cmake --build llama.cpp/build --config Release -j 4

          # Check the build
          ls llama.cpp/build/bin

      - name: Cache AI model
        id: model-cache
        uses: actions/cache@v4
        with:
          path: models/tinyllama.gguf
          key: tinyllama-model-v1

      - name: Download AI model
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: |
          # Make a folder
          mkdir -p models

          # Download TinyLlama
          curl -fL --retry 3 -o models/tinyllama.gguf \
            https://huggingface.co/TheBloke/TinyLlama-1.1B-Chat-v1.0-GGUF/resolve/main/tinyllama-1.1b-chat-v1.0.Q4_K_M.gguf

          # Check the model
          ls -lh models/

      - name: Test normal RAM
        run: |
          # Run TinyLlama normally
          ./llama.cpp/build/bin/llama-cli \
            -m models/tinyllama.gguf \
            -p "Explain artificial intelligence in simple words." \
            -n 100 \
            -t 4 \
            --no-display-prompt

      - name: Test 4 GB RAM limit
        run: |
          # Run TinyLlama with 4 GB RAM
          docker run --rm \
            --memory=4g \
            --cpus=4 \
            -v "$PWD:/work" \
            -w /work \
            ubuntu:24.04 \
            ./llama.cpp/build/bin/llama-cli \
              -m models/tinyllama.gguf \
              -p "Explain artificial intelligence in simple words." \
              -n 100 \
              -t 4 \
              --no-display-prompt

      - name: Test 2 GB RAM limit
        run: |
          # Run TinyLlama with 2 GB RAM
          docker run --rm \
            --memory=2g \
            --cpus=4 \
            -v "$PWD:/work" \
            -w /work \
            ubuntu:24.04 \
            ./llama.cpp/build/bin/llama-cli \
              -m models/tinyllama.gguf \
              -p "Explain artificial intelligence in simple words." \
              -n 100 \
              -t 4 \
              --no-display-prompt
