
name: Test RAM

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Check RAM and CPU
        run: |
          echo "Checking RAM..."
          free -h
          echo "Checking CPU..."
          nproc

      - name: Check Docker swap support
        run: |
          echo "Checking Docker..."
          docker info

          echo "Checking system swap..."
          cat /proc/swaps

          echo "Checking Docker memory and swap limits..."
          docker run --rm --memory=512m --memory-swap=1g ubuntu:24.04 sh -c '
            echo "RAM limit:"
            cat /sys/fs/cgroup/memory.max
            echo "Swap limit:"
            cat /sys/fs/cgroup/memory.swap.max
          '

      - name: Cache llama.cpp
        id: llama-cache
        uses: actions/cache@v4
        with:
          path: llama.cpp
          key: llama-build-v1

      - name: Set up llama.cpp
        if: steps.llama-cache.outputs.cache-hit != 'true'
        run: |
          # Get llama.cpp
          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git

          # Install what we need
          sudo apt-get update
          sudo apt-get install -y cmake build-essential

          # Build llama.cpp
          cmake -S llama.cpp -B llama.cpp/build
          cmake --build llama.cpp/build --config Release -j 4

          # Check the build
          ls llama.cpp/build/bin

      - name: Cache AI model
        id: model-cache
        uses: actions/cache@v4
        with:
          path: models/tinyllama.gguf
          key: tinyllama-model-v1

      - name: Download AI model
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: |
          # Make a folder
          mkdir -p models

          # Download TinyLlama
          curl -fL --retry 3 -o models/tinyllama.gguf \
            https://huggingface.co/TheBloke/TinyLlama-1.1B-Chat-v1.0-GGUF/resolve/main/tinyllama-1.1b-chat-v1.0.Q4_K_M.gguf

          # Check the model
          ls -lh models/

      - name: Test normal RAM
        run: |
          # Run TinyLlama normally
          ./llama.cpp/build/bin/llama-cli \
            -m models/tinyllama.gguf \
            -p "Explain artificial intelligence in simple words." \
            -n 100 \
            -t 4 \
            --no-display-prompt -st < /dev/null

      - name: Test 4 GB RAM limit
        run: |
          # Make a folder for results
          mkdir -p results

          # Run TinyLlama 3 times with 4 GB RAM
          for i in 1 2 3
          do
            echo "4 GB RAM - Test $i"

            docker run --rm \
              --memory=4g \
              --cpus=4 \
              -v "$PWD:/work" \
              -w /work \
              ubuntu:24.04 \
              bash -c '
                apt-get update -qq &&
                apt-get install -y -qq libgomp1 &&
                export LD_LIBRARY_PATH=/work/llama.cpp/build/bin:$LD_LIBRARY_PATH &&
                ./llama.cpp/build/bin/llama-cli \
                  -m models/tinyllama.gguf \
                  -p "Explain artificial intelligence in simple words." \
                  -n 100 \
                  -t 4 \
                  --no-display-prompt -st < /dev/null
              ' 2>&1 | tee "results/4gb_test_$i.txt"

            # Stop if the test fails
            test "${PIPESTATUS[0]}" -eq 0 || exit 1
          done

      - name: Test 2 GB RAM limit
        run: |
          # Run TinyLlama 3 times with 2 GB RAM
          for i in 1 2 3
          do
            echo "2 GB RAM - Test $i"

            docker run --rm \
              --memory=2g \
              --cpus=4 \
              -v "$PWD:/work" \
              -w /work \
              ubuntu:24.04 \
              bash -c '
                apt-get update -qq &&
                apt-get install -y -qq libgomp1 &&
                export LD_LIBRARY_PATH=/work/llama.cpp/build/bin:$LD_LIBRARY_PATH &&
                ./llama.cpp/build/bin/llama-cli \
                  -m models/tinyllama.gguf \
                  -p "Explain artificial intelligence in simple words." \
                  -n 100 \
                  -t 4 \
                  --no-display-prompt -st < /dev/null
              ' 2>&1 | tee "results/2gb_test_$i.txt"

            # Stop if the test fails
            test "${PIPESTATUS[0]}" -eq 0 || exit 1
          done


      
      - name: Test lower RAM and measure memory
        run: |
          mkdir -p results

          for ram in 1g 512m; do
            for i in 1 2 3; do
              echo "Testing $ram - Run $i"

              if [ "$ram" = "512m" ]; then
                swap="1g"
              else
                swap="1g"
              fi

              file="results/${ram}_test_${i}.txt"

              timeout --signal=TERM --kill-after=10s 300s \
                docker run --rm \
                  --memory="$ram" \
                  --memory-swap="$swap" \
                  --cpus=4 \
                  -v "$PWD:/work" \
                  -w /work \
                  ubuntu:24.04 \
                  bash -c '
                    apt-get update -qq
                    apt-get install -y -qq libgomp1 time > /dev/null
                    export LD_LIBRARY_PATH=/work/llama.cpp/build/bin:$LD_LIBRARY_PATH

                    echo "RAM limit:"
                    cat /sys/fs/cgroup/memory.max
                    echo "Swap limit:"
                    cat /sys/fs/cgroup/memory.swap.max

                    echo "RAM peak before:"
                    cat /sys/fs/cgroup/memory.peak
                    echo "Swap peak before:"
                    cat /sys/fs/cgroup/memory.swap.peak

                    /usr/bin/time -v \
                      ./llama.cpp/build/bin/llama-cli \
                      -m models/tinyllama.gguf \
                      -p "Explain artificial intelligence in simple words." \
                      -n 100 -t 4 --no-display-prompt -st < /dev/null

                    echo "RAM peak:"
                    cat /sys/fs/cgroup/memory.peak
                    echo "Swap peak:"
                    cat /sys/fs/cgroup/memory.swap.peak
                    echo "Swap events:"
                    cat /sys/fs/cgroup/memory.swap.events
                  ' > "$file" 2>&1

              code=$?
              echo "Exit code: $code" >> "$file"
              echo "$ram, Test $i, Exit code: $code"
            done
          done

      
      - name: Make results CSV
        if: always()
        run: |
          python3 - <<'PY'
          import csv
          import glob
          import re

          a = []

          for ram, label in [("4gb", "4"), ("2gb", "2"),
                             ("1g", "1"), ("512m", "0.5")]:
              for i in range(1, 4):
                  f = f"results/{ram}_test_{i}.txt"

                  try:
                      with open(f, errors="replace") as x:
                          s = x.read()
                  except FileNotFoundError:
                      s = ""

                  m = re.search(
                      r"Prompt:\s*([\d.]+)\s*t/s\s*\|\s*Generation:\s*([\d.]+)\s*t/s",
                      s
                  )

                  e = re.search(r"Exit code:\s*(\d+)", s)
                  code = int(e.group(1)) if e else None

                  p = re.search(r"RAM peak:\s*(\d+)", s)
                  q = re.search(r"Swap peak:\s*(\d+)", s)
                  t = re.search(r"Maximum resident set size \(kbytes\):\s*(\d+)", s)

                  if code == 124:
                      status = "Timeout"
                  elif code is not None and code != 0:
                      status = "Failed"
                  elif m:
                      status = "Passed"
                  else:
                      status = "Failed"

                  a.append([
                      label, i,
                      m.group(1) if m else "",
                      m.group(2) if m else "",
                      status,
                      round(int(p.group(1)) / 1048576, 1) if p else "",
                      round(int(q.group(1)) / 1048576, 1) if q else "",
                      round(int(t.group(1)) / 1024, 1) if t else "",
                      code if code is not None else ""
                  ])

          with open("results.csv", "w", newline="") as f:
              w = csv.writer(f)
              w.writerow([
                  "RAM_GB", "Test", "Prompt_tps", "Generation_tps",
                  "Status", "RAM_Peak_MB", "Swap_Peak_MB",
                  "Process_Peak_MB", "Exit_Code"
              ])
              w.writerows(a)

          with open("results.csv") as f:
              print(f.read())
          PY


      
      - name: Install graph libraries
        if: always()
        run: pip install pandas matplotlib

      - name: Create graphs
        if: always()
        run: python3 graphs.py



      
      - name: Save test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ram-test-results
          path: |
            results/
            results.csv
            graphs/
          if-no-files-found: warn

