
name: Test RAM

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check RAM and CPU
        run: |
          echo "Checking available RAM..."
          free -h
          echo "Checking CPU..."
          nproc
          echo "Checking Docker..."
          docker --version

      - name: Set up llama.cpp
        run: |
          # Get llama.cpp from GitHub
          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git

          # Install what we need
          sudo apt-get update
          sudo apt-get install -y cmake build-essential

          # Build llama.cpp
          cmake -S llama.cpp -B llama.cpp/build
          cmake --build llama.cpp/build --config Release -j 4

          # Check that it worked
          ls llama.cpp/build/bin

      - name: Download AI model
        run: |
          # Make a folder for the model
          mkdir -p models

          # Download a small LLM
          curl -fL --retry 3 -o models/tinyllama.gguf \
            https://huggingface.co/TheBloke/TinyLlama-1.1B-Chat-v1.0-GGUF/resolve/main/tinyllama-1.1b-chat-v1.0.Q4_K_M.gguf

          # Check the model downloaded
          ls -lh models/


      - name: Test TinyLlama
        run: |
          # Run the AI model
          ./llama.cpp/build/bin/llama-cli \
            -m models/tinyllama.gguf \
            -p "What is artificial intelligence?" \
            -n 50 \
            -t 4 \
            --no-display-prompt

      - name: Test with memory pressure
        run: |
          # Check memory before the test
          free -h

          # Use 8 GB of RAM
          python3 - <<'PY'
          import mmap
          import time

          x = mmap.mmap(-1, 8 * 1024**3)
          for i in range(0, len(x), 4096):
              x[i] = 1

          print("Using 8 GB of RAM")
          time.sleep(30)
          PY

          # Check memory after the test
          free -h

            
